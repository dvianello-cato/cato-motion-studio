<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Test render</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f1ea; }
  #box { position: absolute; top: 0; left: 0; width: 240px; height: 240px; background: #1d1d1b; }
</style>
</head>
<body>
<div id="box"></div>
<script>
  // Film di prova: 3 secondi. Ogni frame dipende solo da t.
  window.DURATION = 3;
  window.FPS = 30;

  const box = document.getElementById('box');
  const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const clamp01 = (x) => Math.min(1, Math.max(0, x));

  window.seek = (t) => {
    // 0–1.5 s: il quadrato attraversa lo schermo
    const p = easeInOut(clamp01(t / 1.5));
    const x = 160 + p * (1920 - 240 - 320);
    // 1.5–3 s: ruota di 90 gradi e cambia colore (succede qualcosa di nuovo)
    const r = easeInOut(clamp01((t - 1.5) / 1.0)) * 90;
    box.style.transform = `translate(${x}px, 420px) rotate(${r}deg)`;
    box.style.background = t >= 1.5 ? '#e4572e' : '#1d1d1b';
  };

  window.seek(0);
</script>
</body>
</html>
