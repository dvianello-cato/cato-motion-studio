<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Prova HyperFrames 9:16</title>
    <!-- Solo per il test di /setup-studio: la stessa prova in verticale. Non è un film. -->
    <script src="assets/lib/gsap/gsap.min.js"></script>
    <script src="assets/lib/gsap/SplitText.min.js"></script>
    <script src="assets/lib/gsap/DrawSVGPlugin.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; src: url("assets/brand/fonts/Manrope-VariableFont_wght.ttf") format("truetype"); font-weight: 200 800; font-display: block; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #FDFDFA; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #sfondo { background: #FDFDFA; }
      #simbolo { position: absolute; left: 290px; top: 560px; width: 500px; height: 500px; }
      #riga { position: absolute; left: 0; width: 1080px; top: 1140px; height: 220px; overflow: hidden; text-align: center; }
      #testo { display: inline-block; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 180px; line-height: 220px; letter-spacing: -0.02em; color: #0C213E; white-space: nowrap; }
      #testo span { color: #0C213E; }
      #linea { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="sfondo" class="clip" data-start="0" data-duration="4" data-track-index="0"></div>
      <div id="scena" class="clip" data-start="0" data-duration="4" data-track-index="1">
        <img id="simbolo" src="assets/brand/logo/cato-simbolo-navy.png" alt="">
        <svg id="linea" viewBox="0 0 1080 1920"><path id="tratto" d="M 330 1400 C 480 1450, 620 1350, 750 1400" fill="none" stroke="#E8A33D" stroke-width="16" stroke-linecap="round"/></svg>
        <div id="riga"><div id="testo">Prova <span>ok</span></div></div>
      </div>
      <audio id="musica" src="assets/brand/audio/cato-music.wav" data-start="0" data-duration="4" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      gsap.registerPlugin(SplitText, DrawSVGPlugin);
      const lettere = SplitText.create("#testo", { type: "chars" }).chars;
      const tl = gsap.timeline({ paused: true });
      tl.from("#simbolo", { scale: 0.6, rotation: -12, duration: 0.9, ease: "back.out(1.6)" }, 0.2)
        .from(lettere, { yPercent: 120, rotation: 8, duration: 0.6, ease: "back.out(1.7)", stagger: 0.05 }, 0.7)
        .from("#tratto", { drawSVG: "0%", duration: 0.7, ease: "power2.inOut" }, 1.4)
        .to("#simbolo", { rotation: 360, duration: 1.2, ease: "power2.inOut" }, 2.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
